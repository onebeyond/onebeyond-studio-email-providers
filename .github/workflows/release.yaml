name: "Release NuGets"

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job get a GitHub OIDC token for NuGet trusted publishing

jobs:
  publish_nugets:
    name: "Publish NuGets"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup .NET CLI"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.x"

      - name: "Restore Solution NuGets"
        run: dotnet restore

      - name: "Build Solution"
        run: dotnet build
          --no-restore
          --configuration "Release"

      - name: "Pack NuGets"
        run: dotnet pack
          --no-restore --no-build
          --configuration "Release"
          --output "nupkgs"

      - name: "Log in to nuget.org (OIDC)"
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: "andrii.kaplanovskyi"   # nuget.org profile name, not email

      - name: "Upload NuGets to nuget.org"
        run: dotnet nuget push "nupkgs/**/*.nupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
